<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0">
<title>AI API TECH T0.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Sarabun:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ── ตัวแปรสี / CSS Variables ── */
:root {
  --orange: #ff6a00;
  --orange2: #ff9f45;
  --orange-glow: rgba(255,106,0,0.3);
  --dark: #080808;
  --dark2: #111111;
  --card: #141414;
  --card2: #1c1c1c;
  --border: rgba(255,106,0,0.2);
  --border-bright: rgba(255,106,0,0.6);
  --text: #f0f0f0;
  --text-dim: #888;
  --text-dimmer: #444;
  --green: #00ff88;
  --blue: #00aaff;
  --font-head: 'Rajdhani', sans-serif;
  --font-body: 'Sarabun', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;

  /* ── ระบบซูม ── */
  --zoom: 1;
  --base-font: 17px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  /* ใช้ font-size เป็นตัวควบคุมซูมหลัก — rem จะ scale ตามนี้ */
  font-size: calc(var(--base-font) * var(--zoom));
  transition: font-size 0.2s ease;
}

body {
  height: 100%;
  background: var(--dark);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  font-size: 1rem;
}

/* ── พื้นหลัง canvas animation ── */
#bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  width: 100% !important; height: 100% !important;
}

.grid-overlay {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(255,106,0,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,106,0,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.vignette {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  pointer-events: none;
}

#app {
  position: relative; z-index: 1;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}

/* ── Header bar ── */
header {
  background: rgba(8,8,8,0.95);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(20px);
  position: relative;
  overflow: visible;
  flex-shrink: 0;
}

header::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--orange), transparent);
  animation: scanline 4s ease-in-out infinite;
}

@keyframes scanline {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.header-left {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
  min-width: 0;
}

.logo-img {
  height: 80px;
  width: auto;
  filter: drop-shadow(0 0 8px var(--orange));
  flex-shrink: 0;
}

.header-title {
  font-family: var(--font-head);
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 3px;
  color: var(--text);
  white-space: nowrap;
}

.header-title span { color: var(--orange); }

.user-badge {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--blue);
  background: rgba(0,170,255,0.08);
  border: 1px solid rgba(0,170,255,0.25);
  padding: 3px 8px;
  border-radius: 3px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: default;
  position: relative;
  white-space: nowrap;
  flex-shrink: 0;
}

.user-badge:hover::after {
  content: attr(data-fullid);
  position: absolute;
  top: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--card2);
  border: 1px solid var(--border);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.58rem;
  color: var(--text-dim);
  white-space: nowrap;
  z-index: 200;
}

.status-badge {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--green);
  background: rgba(0,255,136,0.08);
  border: 1px solid rgba(0,255,136,0.25);
  padding: 3px 8px;
  border-radius: 3px;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  flex-shrink: 0;
}

.status-dot {
  width: 6px; height: 6px;
  background: var(--green);
  border-radius: 50%;
  animation: pulse-green 2s ease-in-out infinite;
  flex-shrink: 0;
}

@keyframes pulse-green {
  0%, 100% { opacity: 1; box-shadow: 0 0 4px var(--green); }
  50% { opacity: 0.4; box-shadow: none; }
}

.header-right {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.icon-btn {
  width: 34px; height: 34px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 30px;
  transition: all 0.2s;
}

.icon-btn:hover {
  border-color: var(--orange);
  color: var(--orange);
  background: var(--orange-glow);
}

/* ── พื้นที่แชท ── */
#chat {
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 0;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
#chat::-webkit-scrollbar-thumb:hover { background: var(--orange); }

/* ── Welcome ── */
#welcome {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  text-align: center;
  animation: fadeUp 0.6s ease both;
}

.welcome-logo-wrap { position: relative; margin-bottom: 50px; }

.welcome-logo {
  height: 100px;
  filter: drop-shadow(0 0 20px var(--orange));
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.welcome-ring {
  position: absolute;
  inset: -16px;
  border-radius: 50%;
  border: 1px solid var(--border);
  animation: spin 8s linear infinite;
}

.welcome-ring::before {
  content: '';
  position: absolute;
  top: -2px; left: 50%;
  width: 4px; height: 4px;
  background: var(--orange);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--orange);
  transform: translateX(-50%);
}

@keyframes spin { to { transform: rotate(360deg); } }

.welcome-title {
  font-family: var(--font-head);
  font-size: 2rem;
  font-weight: 700;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

.welcome-title span { color: var(--orange); }

.welcome-sub {
  font-size: 1rem;
  color: var(--text-dim);
  letter-spacing: 1px;
  margin-bottom: 32px;
}

/* ── Grid ปุ่มหมวดหมู่ ── */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px;
  width: 100%;
  max-width: 800px;
}

.quick-btn {
  background: var(--card);
  border: 1px solid rgba(255,106,0,0.4);
  color: #e8e8e8;
  padding: 12px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 500;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
  line-height: 1.4;
  letter-spacing: 0.3px;
  text-shadow: 0 0 12px rgba(255,255,255,0.15);
}

.quick-btn:hover {
  border-color: var(--orange);
  color: #ffffff;
  background: rgba(255,106,0,0.12);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px rgba(255,106,0,0.2);
  text-shadow: 0 0 16px rgba(255,200,100,0.4);
}

.quick-btn .qicon {
  font-size: 1.15rem;
  flex-shrink: 0;
  filter: drop-shadow(0 0 4px rgba(255,106,0,0.5));
}

/* ── Messages ── */
.msg-wrap {
  display: flex;
  flex-direction: column;
  margin-bottom: 16px;
  animation: fadeUp 0.3s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-wrap.user { align-items: flex-end; }
.msg-wrap.bot  { align-items: flex-start; }

.msg-meta {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-dimmer);
  margin-bottom: 5px;
  letter-spacing: 0.5px;
  padding: 0 4px;
}

.msg-wrap.user .msg-meta { color: rgba(255,106,0,0.4); }

.message {
  max-width: 72%;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 1rem;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
}

.msg-wrap.user .message {
  background: linear-gradient(135deg, var(--orange), #ff4500);
  color: #000;
  font-weight: 500;
  border-bottom-right-radius: 3px;
  box-shadow: 0 4px 20px rgba(255,106,0,0.25);
  position: relative;
  z-index: 2;
}

.msg-wrap.bot .message {
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 3px;
  font-family: var(--font-mono);
  font-size: 0.9rem;
  color: #e0e0e0;
}

.msg-wrap.bot .message::before {
  content: '> ';
  color: var(--orange);
  font-weight: bold;
}

/* ── Loading ── */
.loading-wrap {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 16px;
}

.loading-bubble {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  border-bottom-left-radius: 3px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.loading-dot {
  width: 6px; height: 6px;
  background: var(--orange);
  border-radius: 50%;
  animation: blink 1.2s ease-in-out infinite;
}
.loading-dot:nth-child(2) { animation-delay: 0.2s; }
.loading-dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1); }
}

/* ── Input area ── */
.input-area {
  background: rgba(8,8,8,0.95);
  border-top: 1px solid var(--border);
  padding: 14px 20px;
  backdrop-filter: blur(20px);
  position: relative;
  z-index: 10;
}

.input-area::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--orange), transparent);
  opacity: 0.4;
}

.input-inner {
  display: flex;
  gap: 10px;
  align-items: center;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 6px 6px 16px;
  transition: border-color 0.2s;
  max-width: 900px;
  margin: 0 auto;
}

.input-inner:focus-within {
  border-color: var(--border-bright);
  box-shadow: 0 0 0 3px rgba(255,106,0,0.08);
}

.input-prefix {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  color: var(--orange);
  flex-shrink: 0;
  user-select: none;
}

#messageInput {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-body);
  font-size: 1rem;
  caret-color: var(--orange);
  min-width: 0;
}

#messageInput::placeholder { color: var(--text-dimmer); }

.send-btn {
  background: var(--orange);
  border: none;
  color: #000;
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 2px;
  padding: 9px 20px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}

.send-btn:hover {
  background: var(--orange2);
  box-shadow: 0 0 16px rgba(255,106,0,0.4);
  transform: translateY(-1px);
}

.send-btn:active { transform: translateY(0); }

/* ── มุมกรอบ ── */
.corner-tl, .corner-tr, .corner-bl, .corner-br {
  position: fixed;
  width: 20px; height: 20px;
  z-index: 100;
  pointer-events: none;
}

.corner-tl { top: 68px; left: 4px; border-top: 1px solid var(--orange); border-left: 1px solid var(--orange); }
.corner-tr { top: 68px; right: 4px; border-top: 1px solid var(--orange); border-right: 1px solid var(--orange); }
.corner-bl { bottom: 72px; left: 4px; border-bottom: 1px solid var(--orange); border-left: 1px solid var(--orange); }
.corner-br { bottom: 72px; right: 4px; border-bottom: 1px solid var(--orange); border-right: 1px solid var(--orange); }

.copy-btn {
  display: inline-block;
  margin-top: 6px;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-dimmer);
  background: transparent;
  border: 1px solid var(--text-dimmer);
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.2s;
}
.copy-btn:hover { color: var(--orange); border-color: var(--orange); }

.char-count {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-dimmer);
  flex-shrink: 0;
  min-width: 28px;
  text-align: right;
}

/* ── History Panel ── */
.history-btn {
  width: 34px; height: 34px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
  position: relative;
}
.history-btn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-glow); }

.history-badge {
  position: absolute; top: -4px; right: -4px;
  width: 14px; height: 14px;
  background: var(--orange); border-radius: 50%;
  font-size: 0.55rem; font-family: var(--font-mono);
  color: #000; display: flex; align-items: center; justify-content: center;
  font-weight: bold;
}

.history-panel {
  position: fixed;
  top: 64px; right: 8px;
  z-index: 99999;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 320px;
  max-height: 360px;
  overflow-y: auto;
  display: none;
  animation: fadeUp 0.2s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.8);
}
.history-panel.open { display: block; }

.history-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim);
  letter-spacing: 1px;
}

.history-session-info {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  color: var(--blue);
  padding: 4px 14px 8px;
  opacity: 0.7;
  letter-spacing: 0.5px;
}

.history-clear {
  background: none; border: none; color: var(--text-dimmer);
  cursor: pointer; font-size: 0.65rem; font-family: var(--font-mono);
  transition: color 0.2s;
}
.history-clear:hover { color: var(--orange); }

.history-item {
  padding: 9px 14px; cursor: pointer;
  border-bottom: 1px solid rgba(255,106,0,0.06);
  font-family: var(--font-body); font-size: 0.85rem; color: var(--text-dim);
  transition: all 0.15s; display: flex; align-items: center; gap: 8px;
}
.history-item:hover { background: rgba(255,106,0,0.07); color: var(--text); }
.history-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-time { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-dimmer); flex-shrink: 0; }
.history-empty { padding: 20px; text-align: center; color: var(--text-dimmer);
  font-family: var(--font-mono); font-size: 0.7rem; }

/* ── Unit Converter Panel ── */
.unit-btn {
  width: 34px; height: 34px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
}
.unit-btn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-glow); }

.unit-panel {
  position: fixed;
  top: 64px; right: 8px;
  z-index: 99999;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 340px;
  display: none;
  animation: fadeUp 0.2s ease;
  box-shadow: 0 8px 32px rgba(0,0,0,0.8);
  max-height: 80vh;
  overflow-y: auto;
}
.unit-panel.open { display: block; }

.unit-panel-header {
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim);
  letter-spacing: 1px;
  display: flex; align-items: center; justify-content: space-between;
}

.unit-tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.unit-tabs::-webkit-scrollbar { display: none; }

.unit-tab {
  flex-shrink: 0;
  padding: 8px 10px; text-align: center;
  font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dim);
  cursor: pointer; border: none; background: none;
  border-bottom: 2px solid transparent;
  transition: all 0.15s; letter-spacing: 0.5px;
}
.unit-tab.active { color: var(--orange); border-bottom-color: var(--orange); }
.unit-tab:hover:not(.active) { color: var(--text); }

.unit-content { padding: 12px 14px 14px; }

.unit-all-grid { display: flex; flex-direction: column; gap: 8px; }
.unit-all-row { display: grid; grid-template-columns: 60px 1fr; align-items: center; gap: 8px; }
.unit-all-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--orange); text-align: right; user-select: none; }
.unit-all-input {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 12px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.85rem;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  width: 100%;
}
.unit-all-input:focus { border-color: var(--border-bright); box-shadow: 0 0 0 2px rgba(255,106,0,0.1); }
.unit-all-input.result-field { color: #ccc; }
.unit-divider { height: 1px; background: var(--border); margin: 4px 0; opacity: 0.5; }
.unit-hint { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-dimmer); text-align: center; margin-top: 8px; letter-spacing: 0.5px; }

/* ── Bot Card ── */
.bot-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-bottom-left-radius: 3px;
  border-radius: 10px;
  max-width: 82%;
  overflow: hidden;
  animation: fadeUp 0.3s ease both;
  position: relative;
  z-index: 2;
}

.bot-card-header {
  background: rgba(255,106,0,0.1);
  border-bottom: 1px solid var(--border);
  padding: 7px 14px;
  display: flex; align-items: center; justify-content: space-between;
}

.bot-card-title {
  font-family: var(--font-mono); font-size: 0.65rem;
  color: var(--orange); letter-spacing: 1px;
}

.bot-card-body { padding: 0; }

.card-section { border-bottom: 1px solid rgba(255,106,0,0.08); padding: 8px 14px; }
.card-section:last-child { border-bottom: none; }
.card-section-label { font-family: var(--font-mono); font-size: 0.58rem; color: var(--text-dimmer); letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
.card-kv { display: flex; flex-direction: column; gap: 3px; }
.card-row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--font-mono); font-size: 0.8rem; }
.card-key { color: var(--text-dim); }
.card-val { color: var(--text); font-weight: 500; }
.card-val.highlight { color: var(--orange); font-size: 0.92rem; }
.card-plain { font-family: var(--font-mono); font-size: 0.8rem; color: #e0e0e0; line-height: 1.8; white-space: pre-wrap; }
.card-actions { padding: 6px 14px 8px; display: flex; gap: 6px; }

/* ── Voice Input ── */
.voice-btn {
  width: 34px; height: 34px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  transition: all 0.2s;
  flex-shrink: 0;
}
.voice-btn:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-glow); }
.voice-btn.listening { border-color: #ff3333; color: #ff3333; background: rgba(255,51,51,0.12); animation: pulse-red 1s ease-in-out infinite; }
@keyframes pulse-red { 0%,100% { box-shadow: 0 0 0 0 rgba(255,51,51,0.4); } 50% { box-shadow: 0 0 0 6px rgba(255,51,51,0); } }

.voice-status {
  font-family: var(--font-mono); font-size: 0.65rem; color: #ff3333;
  letter-spacing: 1px; margin-left: 4px; flex-shrink: 0; display: none;
}
.voice-status.active { display: inline; animation: blink-text 1s ease-in-out infinite; }
@keyframes blink-text { 0%,100%{opacity:1} 50%{opacity:0.3} }

.share-btn { display: inline-block; font-family: var(--font-mono); font-size: 0.65rem; color: var(--text-dimmer); background: transparent; border: 1px solid var(--text-dimmer); padding: 2px 8px; border-radius: 3px; cursor: pointer; transition: all 0.2s; }
.share-btn:hover { color: #00cc66; border-color: #00cc66; }

.share-toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: #00cc66; color: #000;
  font-family: var(--font-mono); font-size: 0.7rem; font-weight: 700;
  padding: 8px 20px; border-radius: 20px;
  letter-spacing: 1px; z-index: 9999;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.share-toast.show { opacity: 1; }

/* ══════════════════════════════════════════════
   ZOOM CONTROL PANEL  ← ใหม่
   ══════════════════════════════════════════════ */

.zoom-panel {
  position: fixed;
  bottom: 90px;
  right: 12px;
  z-index: 99998;
  background: var(--card2);
  border: 1px solid var(--border-bright);
  border-radius: 12px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.7), 0 0 20px rgba(255,106,0,0.1);
  backdrop-filter: blur(10px);
  transition: opacity 0.2s;
  min-width: 46px;
}

.zoom-panel:hover { opacity: 1 !important; }

/* ปุ่มเปิด/ปิด zoom panel ลอยอยู่ที่มุม */
.zoom-fab {
  position: fixed;
  bottom: 90px;
  right: 12px;
  z-index: 99999;
  width: 44px; height: 44px;
  background: var(--card2);
  border: 1px solid var(--border-bright);
  border-radius: 50%;
  color: var(--orange);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.6), 0 0 12px rgba(255,106,0,0.2);
  transition: all 0.2s;
  backdrop-filter: blur(10px);
}
.zoom-fab:hover {
  background: rgba(255,106,0,0.15);
  border-color: var(--orange);
  transform: scale(1.08);
}
.zoom-fab.active {
  background: rgba(255,106,0,0.2);
  border-color: var(--orange);
  box-shadow: 0 0 20px rgba(255,106,0,0.4);
}

/* กล่อง zoom controls จริง */
.zoom-controls {
  position: fixed;
  bottom: 142px;
  right: 8px;
  z-index: 99998;
  background: var(--card2);
  border: 1px solid var(--border-bright);
  border-radius: 14px;
  padding: 14px 14px 12px;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  width: 200px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.8), 0 0 24px rgba(255,106,0,0.12);
  backdrop-filter: blur(12px);
  animation: fadeUp 0.2s ease;
}
.zoom-controls.open { display: flex; }

.zoom-title {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--orange);
  letter-spacing: 2px;
  align-self: flex-start;
}

/* แถวปุ่ม − ค่า + */
.zoom-row {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.zoom-minus, .zoom-plus {
  width: 36px; height: 36px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 1.1rem;
  font-family: var(--font-mono);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
  user-select: none;
}
.zoom-minus:hover, .zoom-plus:hover {
  border-color: var(--orange);
  color: var(--orange);
  background: rgba(255,106,0,0.1);
}
.zoom-minus:active, .zoom-plus:active { transform: scale(0.92); }

.zoom-val {
  flex: 1;
  text-align: center;
  font-family: var(--font-mono);
  font-size: 1rem;
  font-weight: 700;
  color: var(--orange);
  letter-spacing: 1px;
}

/* Slider ซูม */
.zoom-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  outline: none;
  cursor: pointer;
}

.zoom-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--orange);
  cursor: pointer;
  box-shadow: 0 0 8px rgba(255,106,0,0.5);
  transition: transform 0.15s;
}
.zoom-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
.zoom-slider::-moz-range-thumb {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--orange);
  cursor: pointer;
  border: none;
  box-shadow: 0 0 8px rgba(255,106,0,0.5);
}

/* ปุ่ม reset */
.zoom-reset {
  background: none;
  border: 1px solid rgba(255,106,0,0.3);
  border-radius: 6px;
  color: var(--text-dimmer);
  font-family: var(--font-mono);
  font-size: 0.6rem;
  letter-spacing: 1px;
  padding: 4px 12px;
  cursor: pointer;
  transition: all 0.2s;
  width: 100%;
}
.zoom-reset:hover { border-color: var(--orange); color: var(--orange); }

/* preset zoom buttons */
.zoom-presets {
  display: flex;
  gap: 4px;
  width: 100%;
}
.zoom-preset-btn {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 0.58rem;
  padding: 4px 2px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}
.zoom-preset-btn:hover, .zoom-preset-btn.active {
  border-color: var(--orange);
  color: var(--orange);
  background: rgba(255,106,0,0.1);
}

/* ══════════════════════════════════════════════
   MODAL
   ══════════════════════════════════════════════ */

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100000;
  background: rgba(0,0,0,0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

.modal-box {
  background: var(--card2);
  border: 1px solid var(--border-bright);
  border-radius: 14px;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 40px rgba(255,106,0,0.15);
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.modal-box::-webkit-scrollbar { width: 4px; }
.modal-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card2);
  z-index: 1;
}

.modal-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.modal-icon {
  width: 48px; height: 48px;
  object-fit: contain;
  filter: drop-shadow(0 0 6px var(--orange));
}

.modal-title {
  font-family: var(--font-head);
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--text);
}

.modal-subtitle {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--orange);
  letter-spacing: 1px;
  margin-top: 2px;
}

.modal-close {
  width: 32px; height: 32px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  transition: all 0.2s;
  flex-shrink: 0;
}
.modal-close:hover { border-color: var(--orange); color: var(--orange); background: var(--orange-glow); }

.modal-body { padding: 16px 20px 20px; }

.modal-desc {
  background: rgba(255,106,0,0.06);
  border-left: 3px solid var(--orange);
  border-radius: 0 6px 6px 0;
  padding: 10px 14px;
  margin-bottom: 16px;
}

.modal-desc p {
  font-family: var(--font-body);
  font-size: 0.88rem;
  color: var(--text-dim);
  line-height: 1.7;
}

.modal-section-title {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--orange);
  letter-spacing: 2px;
  margin-bottom: 10px;
  padding-bottom: 4px;
  border-bottom: 1px solid rgba(255,106,0,0.2);
}

.modal-params {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}

.modal-param {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--blue);
  background: rgba(0,170,255,0.08);
  border: 1px solid rgba(0,170,255,0.25);
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.5px;
}

.modal-examples { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }

.modal-example-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.modal-example-btn:hover {
  border-color: var(--orange);
  background: rgba(255,106,0,0.08);
  transform: translateX(3px);
}

.modal-example-icon {
  color: var(--orange);
  font-size: 0.78rem;
  flex-shrink: 0;
  font-family: var(--font-mono);
}

.modal-example-text {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: #ccc;
  line-height: 1.5;
  flex: 1;
}

.modal-example-send {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  color: var(--text-dimmer);
  flex-shrink: 0;
  transition: color 0.2s;
}
.modal-example-btn:hover .modal-example-send { color: var(--orange); }

.modal-footer {
  display: flex;
  gap: 8px;
  align-items: center;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  margin-top: 4px;
}

.modal-input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 12px;
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 0.78rem;
  outline: none;
  transition: border-color 0.2s;
}
.modal-input:focus { border-color: var(--border-bright); }

.modal-send-btn {
  background: var(--orange);
  border: none;
  color: #000;
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 0.78rem;
  letter-spacing: 1px;
  padding: 8px 16px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.2s;
  flex-shrink: 0;
}
.modal-send-btn:hover { background: var(--orange2); box-shadow: 0 0 12px rgba(255,106,0,0.4); }

/* ── RESPONSIVE ── */
* { max-width: 100%; }
img, video, canvas { max-width: 100%; height: auto; }

@media (max-width: 480px) {
  html { --base-font: 15px; }
  header { padding: 0 8px; height: 52px; overflow: visible; }
  .logo-img { height: 26px; }
  .header-title { font-size: 0.8rem; letter-spacing: 0; }
  .header-left { gap: 5px; }
  .status-badge { font-size: 0.55rem; padding: 2px 4px; letter-spacing: 0; gap: 3px; }
  .status-dot { width: 5px; height: 5px; }
  .user-badge { font-size: 0.55rem; padding: 2px 4px; letter-spacing: 0; }
  .icon-btn, .unit-btn, .history-btn { width: 28px; height: 28px; font-size: 11px; }
  .header-right { gap: 4px; }
  .corner-tl, .corner-tr { top: 56px; }
  .corner-bl, .corner-br { bottom: 60px; }
  #chat { padding: 10px; }
  .message { max-width: 92%; padding: 10px 12px; }
  .bot-card { max-width: 96%; }
  .quick-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .quick-btn { padding: 9px 8px; font-size: 0.82rem; gap: 6px; }
  .quick-btn .qicon { font-size: 0.9rem; }
  #welcome { padding: 16px 8px; }
  .welcome-title { font-size: 1.4rem; letter-spacing: 2px; }
  .welcome-logo { height: 60px; }
  .welcome-sub { font-size: 0.82rem; margin-bottom: 16px; }
  .input-area { padding: 8px 10px; }
  .input-inner { padding: 4px 4px 4px 10px; gap: 5px; }
  .send-btn { padding: 7px 12px; font-size: 0.72rem; letter-spacing: 1px; }
  .voice-btn { width: 28px; height: 28px; font-size: 13px; }
  .history-panel { top: 52px; right: 0; left: 0; width: 100%; max-height: 55vh; border-radius: 0 0 12px 12px; }
  .unit-panel { top: 52px; right: 0; left: 0; width: 100%; border-radius: 0 0 12px 12px; }
  .zoom-fab { bottom: 80px; right: 8px; width: 40px; height: 40px; font-size: 16px; }
  .zoom-controls { bottom: 128px; right: 4px; width: 180px; }
  .modal-box { max-width: 100%; border-radius: 12px; }
  .modal-title { font-size: 1rem; }
  .modal-icon { width: 38px; height: 38px; }
}

@media (min-width: 481px) and (max-width: 600px) {
  html { --base-font: 15.5px; }
  header { padding: 0 10px; height: 54px; overflow: visible; }
  .logo-img { height: 30px; }
  .header-title { font-size: 0.9rem; letter-spacing: 1px; }
  .header-left { gap: 6px; }
  .corner-tl, .corner-tr { top: 58px; }
  .corner-bl, .corner-br { bottom: 62px; }
  #chat { padding: 12px; }
  .message { max-width: 90%; padding: 10px 12px; }
  .bot-card { max-width: 95%; }
  .quick-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
  .quick-btn { padding: 10px 10px; font-size: 0.88rem; }
  #welcome { padding: 20px 10px; }
  .welcome-title { font-size: 1.55rem; }
  .welcome-logo { height: 70px; }
  .input-area { padding: 10px 12px; }
  .input-inner { padding: 5px 5px 5px 12px; gap: 6px; }
  .send-btn { padding: 8px 14px; font-size: 0.72rem; }
  .zoom-fab { bottom: 80px; right: 8px; }
  .zoom-controls { right: 4px; width: 185px; }
  .history-panel { top: 54px; right: 0; left: 0; width: 100%; max-height: 55vh; border-radius: 0 0 12px 12px; }
  .unit-panel { top: 54px; right: 0; left: 0; width: 100%; border-radius: 0 0 12px 12px; }
}

@media (min-width: 601px) and (max-width: 900px) {
  .quick-grid { grid-template-columns: repeat(3, 1fr); }
  .message { max-width: 82%; }
  .bot-card { max-width: 88%; }
  header { padding: 0 16px; }
}

/* iOS safe area */
.input-area { padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
header { padding-left: max(24px, env(safe-area-inset-left)); padding-right: max(24px, env(safe-area-inset-right)); }

/* Touch targets */
@media (hover: none) and (pointer: coarse) {
  .quick-btn { min-height: 48px; }
  .send-btn, .voice-btn, .icon-btn, .unit-btn, .history-btn { min-height: 40px; min-width: 40px; }
  .history-item { min-height: 48px; }
  .modal-example-btn { min-height: 52px; }
  .zoom-fab { min-height: 48px; min-width: 48px; }
  .zoom-minus, .zoom-plus { min-height: 44px; min-width: 44px; }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="grid-overlay"></div>
<div class="vignette"></div>

<div class="corner-tl"></div>
<div class="corner-tr"></div>
<div class="corner-bl"></div>
<div class="corner-br"></div>

<!-- ══ ZOOM FAB ══ -->
<button class="zoom-fab" id="zoomFab" onclick="toggleZoomPanel()" title="ปรับขนาดตัวอักษร / ซูม">🔍</button>

<!-- ══ ZOOM CONTROLS ══ -->
<div class="zoom-controls" id="zoomControls">
  <div class="zoom-title">◈ ปรับขนาด UI / ซูม</div>
  <div class="zoom-row">
    <button class="zoom-minus" onclick="adjustZoom(-0.05)" title="เล็กลง">−</button>
    <span class="zoom-val" id="zoomVal">100%</span>
    <button class="zoom-plus"  onclick="adjustZoom(+0.05)" title="ใหญ่ขึ้น">+</button>
  </div>
  <input
    type="range"
    class="zoom-slider"
    id="zoomSlider"
    min="0.7"
    max="1.6"
    step="0.05"
    value="1"
    oninput="setZoom(parseFloat(this.value))"
  >
  <div class="zoom-presets">
    <button class="zoom-preset-btn" onclick="setZoom(0.8)"  data-zoom="0.8">80%</button>
    <button class="zoom-preset-btn" onclick="setZoom(1.0)"  data-zoom="1.0">100%</button>
    <button class="zoom-preset-btn" onclick="setZoom(1.2)"  data-zoom="1.2">120%</button>
    <button class="zoom-preset-btn" onclick="setZoom(1.4)"  data-zoom="1.4">140%</button>
  </div>
  <button class="zoom-reset" onclick="setZoom(1.0)">⟳ รีเซ็ตค่าเริ่มต้น</button>
</div>

<div id="app">
  <header>
    <div class="header-left">
      <img src="logochim.png" class="logo-img" alt="logo" onerror="this.style.display='none'">
      <div>
        <div class="header-title"><span> </span> </div>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        ONLINE
      </div>
      <div class="user-badge" id="userBadge" title="Session ID ของคุณ">
        USR:------
      </div>
    </div>
    <div class="header-right">
      <button class="unit-btn" onclick="toggleUnit()" title="แปลงหน่วย">⚖</button>
      <button class="history-btn" onclick="toggleHistory()" title="ประวัติ" id="historyBtn">
        🕐<span class="history-badge" id="histBadge" style="display:none">0</span>
      </button>
      <button class="icon-btn" onclick="clearChat()" title="ล้างแชท">🔙</button>
    </div>
  </header>

  <!-- History panel -->
  <div class="history-panel" id="historyPanel">
    <div class="history-header">
      <span>HISTORY</span>
      <button class="history-clear" onclick="clearHistory()">ล้างทั้งหมด</button>
    </div>
    <div class="history-session-info" id="historySessionInfo">SESSION: ------</div>
    <div id="historyList"><div class="history-empty">ยังไม่มีประวัติ</div></div>
  </div>

  <!-- Unit converter panel -->
  <div class="unit-panel" id="unitPanel">
    <div class="unit-panel-header">
      <span>⚖ UNIT CONVERTER</span>
      <span style="font-size:0.58rem;color:var(--text-dimmer)">พิมพ์ที่ช่องใดก็ได้</span>
    </div>
    <div class="unit-tabs">
      <button class="unit-tab active" onclick="setUnitTab('pressure',this)">แรงดัน</button>
      <button class="unit-tab" onclick="setUnitTab('torque',this)">แรงบิด</button>
      <button class="unit-tab" onclick="setUnitTab('length',this)">ความยาว</button>
      <button class="unit-tab" onclick="setUnitTab('speed',this)">ความเร็ว</button>
      <button class="unit-tab" onclick="setUnitTab('temp',this)">อุณหภูมิ</button>
    </div>
    <div class="unit-content" id="unitContent"></div>
  </div>

  <!-- พื้นที่แชท -->
  <div id="chat">
    <div id="welcome">
      <div class="welcome-logo-wrap">
        <img src="logo1.png" class="welcome-logo" alt="logo" onerror="this.style.display='none'">
        <div class="welcome-ring"></div>
      </div>
      <div class="welcome-title">AI API <span>TECH</span> T0.1</div>
      <div class="welcome-sub">ระบบวิเคราะห์และคำนวณเครื่องยนต์อัจฉริยะ</div>

      <div class="quick-grid">

        <button class="quick-btn" onclick="openModal('obd')">

<script>
/* ══════════════════════════════════════════════
   ZOOM SYSTEM
   ══════════════════════════════════════════════ */
const ZOOM_KEY = 'apitech_zoom';
let currentZoom = 1.0;

function initZoom() {
  const saved = parseFloat(localStorage.getItem(ZOOM_KEY) || '1.0');
  setZoom(isNaN(saved) ? 1.0 : saved, false);
}

function setZoom(val, save = true) {
  val = Math.min(1.6, Math.max(0.7, val));
  currentZoom = val;
  document.documentElement.style.setProperty('--zoom', val);
  // อัปเดต UI
  const display = Math.round(val * 100) + '%';
  const valEl = document.getElementById('zoomVal');
  const slider = document.getElementById('zoomSlider');
  if (valEl) valEl.textContent = display;
  if (slider) slider.value = val;
  // อัปเดต preset buttons
  document.querySelectorAll('.zoom-preset-btn').forEach(btn => {
    const bv = parseFloat(btn.getAttribute('data-zoom'));
    btn.classList.toggle('active', Math.abs(bv - val) < 0.01);
  });
  if (save) {
    try { localStorage.setItem(ZOOM_KEY, val); } catch(e) {}
  }
}

function adjustZoom(delta) {
  setZoom(currentZoom + delta);
}

function toggleZoomPanel() {
  const panel = document.getElementById('zoomControls');
  const fab   = document.getElementById('zoomFab');
  if (!panel) return;
  const isOpen = panel.classList.toggle('open');
  fab.classList.toggle('active', isOpen);
  // ปิด panels อื่น
  if (isOpen) {
    document.getElementById('historyPanel')?.classList.remove('open');
    document.getElementById('unitPanel')?.classList.remove('open');
  }
}

/* pinch-to-zoom บน mobile */
(function() {
  let startDist = 0;
  let startZoom = 1;
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      startDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      startZoom = currentZoom;
    }
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const ratio = dist / startDist;
      setZoom(startZoom * ratio);
    }
  }, { passive: true });
})();

/* ── localStorage fallback ── */
const storage = (function() {
  try {
    const t = '__test__';
    localStorage.setItem(t, t);
    localStorage.removeItem(t);
    return {
      _mem: {},
      getItem(k)    { try { return localStorage.getItem(k); }    catch(e) { return this._mem[k] || null; } },
      setItem(k, v) { try { localStorage.setItem(k, v); }        catch(e) { this._mem[k] = v; } },
      removeItem(k) { try { localStorage.removeItem(k); }        catch(e) { delete this._mem[k]; } }
    };
  } catch(e) {
    const mem = {};
    return { _mem: mem, getItem(k) { return mem[k]||null; }, setItem(k,v) { mem[k]=v; }, removeItem(k) { delete mem[k]; } };
  }
})();

/* ── User ID ── */
const USER_ID_KEY = 'apitech_userid';
function generateUUID() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function initUser() {
  let uid = storage.getItem(USER_ID_KEY);
  if (!uid) { uid = generateUUID(); storage.setItem(USER_ID_KEY, uid); }
  return uid;
}
const userId  = initUser();
const shortId = userId.replace(/-/g,'').slice(0,6).toUpperCase();
const HISTORY_KEY = 'apitech_history_' + userId;

document.addEventListener('DOMContentLoaded', () => {
  const badge = document.getElementById('userBadge');
  if (badge) { badge.textContent = 'USR:' + shortId; badge.setAttribute('data-fullid', userId); }
  const sessInfo = document.getElementById('historySessionInfo');
  if (sessInfo) sessInfo.textContent = 'SESSION: ' + shortId + ' · ประวัติของคุณเท่านั้น';
  renderHistory();
  initZoom(); // ← โหลดค่าซูมที่บันทึกไว้
});

/* ── Background animation ── */
const canvas = document.getElementById('bg-canvas');
const ctx    = canvas.getContext('2d');
let W = canvas.width  = window.innerWidth;
let H = canvas.height = window.innerHeight;
window.addEventListener('resize', () => { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; });

const opts = {
  len:18,count:25,baseTime:30,addedTime:25,dieChance:.03,spawnChance:.6,
  sparkChance:.05,sparkDist:6,color:'hsl(hue,100%,light%)',
  baseLight:50,addedLight:10,shadowToTimePropMult:4,
  baseLightInputMultiplier:.008,addedLightInputMultiplier:.015,
  cx:W/2,cy:H/2,repaintAlpha:.03,hueChange:.02,
};
let tick=0; const lines=[]; const dieX=W/2/opts.len; const dieY=H/2/opts.len; const baseRad=Math.PI*2/6;
ctx.fillStyle='black'; ctx.fillRect(0,0,W,H);
class Line {
  constructor() { this.reset(); }
  reset() { this.x=0;this.y=0;this.addedX=0;this.addedY=0;this.rad=0;this.lightInputMultiplier=opts.baseLightInputMultiplier+opts.addedLightInputMultiplier*Math.random();this.color=opts.color.replace('hue',tick*opts.hueChange);this.cumulativeTime=0;this.beginPhase(); }
  beginPhase() { this.x+=this.addedX;this.y+=this.addedY;this.time=0;this.targetTime=(opts.baseTime+opts.addedTime*Math.random())|0;this.rad+=baseRad*(Math.random()<.5?1:-1);this.addedX=Math.cos(this.rad);this.addedY=Math.sin(this.rad);if(Math.random()<opts.dieChance||this.x>dieX||this.x<-dieX||this.y>dieY||this.y<-dieY)this.reset(); }
  step() { ++this.time;++this.cumulativeTime;if(this.time>=this.targetTime)this.beginPhase();const prop=this.time/this.targetTime;const wave=Math.sin(prop*Math.PI/2);ctx.shadowBlur=prop*opts.shadowToTimePropMult;ctx.fillStyle=ctx.shadowColor=this.color.replace('light',opts.baseLight+opts.addedLight*Math.sin(this.cumulativeTime*this.lightInputMultiplier));ctx.fillRect(opts.cx+(this.x+wave*this.addedX)*opts.len,opts.cy+(this.y+wave*this.addedY)*opts.len,2,2); }
}
function loop() { requestAnimationFrame(loop);++tick;opts.cx=W/2;opts.cy=H/2;ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;ctx.fillStyle='rgba(0,0,0,'+opts.repaintAlpha+')';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';if(lines.length<opts.count&&Math.random()<opts.spawnChance)lines.push(new Line());lines.forEach(l=>l.step()); }
loop();

/* ── Chat core ── */
const webhookURL = "https://a7ivalc0.rpcld.com/webhook/lineoa";
const chat  = document.getElementById('chat');
const input = document.getElementById('messageInput');
let msgCount=0, lastUserMsg='';

function updateCharCount(el) { document.getElementById('charCount').textContent = el.value.length; }
function getTime() { return new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit', second:'2-digit' }); }
function clearChat() { chat.innerHTML=''; location.reload(); }
function quickAsk(text) { input.value=text; updateCharCount(input); sendMessage(); }
function removeWelcome() { const w=document.getElementById('welcome'); if(w)w.remove(); }

function addMessage(text, sender) {
  removeWelcome(); msgCount++;
  if (sender==='user') {
    lastUserMsg=text;
    const wrap=document.createElement('div'); wrap.className='msg-wrap user';
    const meta=document.createElement('div'); meta.className='msg-meta'; meta.textContent=`YOU [${shortId}] · ${getTime()}`;
    const bubble=document.createElement('div'); bubble.className='message'; bubble.textContent=text;
    wrap.appendChild(meta); wrap.appendChild(bubble); chat.appendChild(wrap);
  } else {
    const card=buildCard(text, getTime(), lastUserMsg); chat.appendChild(card);
  }
  chat.scrollTop=chat.scrollHeight;
}
function addLoading() { removeWelcome(); const wrap=document.createElement('div'); wrap.className='loading-wrap'; wrap.id='loading'; wrap.innerHTML=`<div class="loading-bubble"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div>`; chat.appendChild(wrap); chat.scrollTop=chat.scrollHeight; }
function removeLoading() { const el=document.getElementById('loading'); if(el)el.remove(); }

async function sendMessage() {
  const message = input.value.trim();
  if (!message) return;
  addMessage(message, 'user');
  saveToHistory(message);
  input.value=''; updateCharCount(input);
  addLoading();
  try {
    const res  = await fetch(webhookURL, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ message }) });
    const data = await res.json();
    removeLoading();
    addMessage(data.reply ? data.reply.trim() : 'ไม่มีคำตอบจาก AI', 'bot');
  } catch(e) {
    removeLoading();
    addMessage('ไม่สามารถเชื่อมต่อกับ AI Server ได้\nกรุณาตรวจสอบการเชื่อมต่อและลองใหม่', 'bot');
  }
}

/* ── History ── */
function loadHistory() { try { return JSON.parse(storage.getItem(HISTORY_KEY)||'[]'); } catch(e) { return []; } }
function saveToHistory(msg) {
  try {
    let h=loadHistory(); h=h.filter(x=>x.text!==msg); h.unshift({text:msg,time:getTime()});
    if(h.length>20) h=h.slice(0,20); storage.setItem(HISTORY_KEY, JSON.stringify(h));
  } catch(e) {}
  renderHistory();
}
function clearHistory() { try { storage.removeItem(HISTORY_KEY); } catch(e) {} renderHistory(); }
function renderHistory() {
  const list=document.getElementById('historyList'); const badge=document.getElementById('histBadge');
  if(!list||!badge) return;
  const h=loadHistory(); badge.textContent=h.length; badge.style.display=h.length?'flex':'none'; list.innerHTML='';
  if(!h.length) { list.innerHTML='<div class="history-empty">ยังไม่มีประวัติ</div>'; return; }
  h.forEach(x => {
    const item=document.createElement('div'); item.className='history-item';
    const s1=document.createElement('span'); s1.textContent=x.text;
    const s2=document.createElement('span'); s2.className='history-time'; s2.textContent=x.time;
    item.appendChild(s1); item.appendChild(s2);
    item.addEventListener('click', () => { input.value=x.text; updateCharCount(input); toggleHistory(); setTimeout(()=>sendMessage(),50); });
    list.appendChild(item);
  });
}
function toggleHistory() {
  const p=document.getElementById('historyPanel'); const u=document.getElementById('unitPanel');
  if(!p) return;
  u&&u.classList.remove('open');
  document.getElementById('zoomControls')?.classList.remove('open');
  document.getElementById('zoomFab')?.classList.remove('active');
  p.classList.toggle('open');
  if(p.classList.contains('open')) renderHistory();
}

/* ── ปิด panel เมื่อ click ข้างนอก ── */
document.addEventListener('click', e => {

});

let currentUnitTab='pressure';
function setUnitTab(tab,el) { currentUnitTab=tab; document.querySelectorAll('.unit-tab').forEach(t=>t.classList.remove('active')); el.classList.add('active'); renderUnitContent(); }
function formatUnitValue(val) { if(isNaN(val)||!isFinite(val))return''; const abs=Math.abs(val); if(abs===0)return'0'; if(abs<0.0001||abs>=1e8)return val.toPrecision(4); if(Number.isInteger(val))return val.toString(); return parseFloat(val.toFixed(4)).toString(); }
function renderUnitContent() {
  const def=unitDefs[currentUnitTab]; const c=document.getElementById('unitContent'); if(!c)return;
  let html=`<div class="unit-all-grid">`;
  def.inputs.forEach((inp,idx) => {
    html+=`<div class="unit-all-row"><span class="unit-all-label">${inp.label}</span><input class="unit-all-input" id="${inp.id}" type="number" placeholder="0" step="any" autocomplete="off" oninput="convertFromField('${inp.id}','${currentUnitTab}')" onfocus="this.select()"></div>`;
    if(idx===1&&def.inputs.length>3) html+=`<div class="unit-divider"></div>`;
  });
  html+=`</div><div class="unit-hint">▶ พิมพ์ที่ช่องใดก็ได้ · ผลลัพธ์อัปเดตทุกช่องทันที</div>`;
  c.innerHTML=html;
}
function convertFromField(sourceId,tab) {
  try {
    const def=unitDefs[tab]; const srcDef=def.inputs.find(x=>x.id===sourceId); const el=document.getElementById(sourceId);
    if(!el||!srcDef)return; const rawVal=el.value.trim(); if(rawVal===''||rawVal==='-') { def.inputs.filter(x=>x.id!==sourceId).forEach(x=>{const e2=document.getElementById(x.id);if(e2){e2.value='';e2.classList.remove('result-field');}}); return; }
    const val=parseFloat(rawVal); if(isNaN(val))return;
    const baseVal=tab==='temp'?srcDef.toC(val):srcDef.toBase(val);
    def.inputs.filter(x=>x.id!==sourceId).forEach(x=>{const e2=document.getElementById(x.id);if(!e2)return;const converted=tab==='temp'?x.fromC(baseVal):x.fromBase(baseVal);e2.value=formatUnitValue(converted);e2.classList.add('result-field');});
    el.classList.remove('result-field');
  } catch(e){}
}
function toggleUnit() {
  const p=document.getElementById('unitPanel'); const h=document.getElementById('historyPanel');
  if(!p)return; h&&h.classList.remove('open');
  document.getElementById('zoomControls')?.classList.remove('open');
  document.getElementById('zoomFab')?.classList.remove('active');
  const isOpen=p.classList.toggle('open');
  if(isOpen) { renderUnitContent(); setTimeout(()=>{const first=p.querySelector('.unit-all-input');if(first)first.focus();},150); }
}

/* ── Bot card builder ── */
function parseToCard(text) {
  const lines=text.split('\n').filter(l=>l.trim()); if(lines.length<3)return null;
  const sections=[]; let current=null; const isKV=l=>/^[\w\s()/%°]+\s*[=≈]\s*.+/.test(l);
  for(const line of lines) {
    const trimmed=line.trim(); if(!trimmed)continue;
    if(isKV(trimmed)) {
      if(!current||current.type!=='kv'){current={type:'kv',items:[]};sections.push(current);}
      const sep=trimmed.includes('≈')?'≈':'='; const idx=trimmed.indexOf(sep);
      current.items.push({key:trimmed.slice(0,idx).trim(),val:trimmed.slice(idx+1).trim(),sep});
    } else { current={type:'text',text:trimmed}; sections.push(current); current=null; }
  }
  return sections.length>=2?sections:null;
}
function buildCard(text,timeStr,question) {
  const sections=parseToCard(text); const card=document.createElement('div'); card.className='msg-wrap bot';
  const meta=document.createElement('div'); meta.className='msg-meta'; meta.textContent=`AI APITECH · ${timeStr}`; card.appendChild(meta);
  if(!sections) {
    const wrap=document.createElement('div'); wrap.className='bot-card';
    const header=document.createElement('div'); header.className='bot-card-header'; header.innerHTML='<span class="bot-card-title">AI APITECH</span>';
    const body=document.createElement('div'); body.className='bot-card-body';
    const sec=document.createElement('div'); sec.className='card-section';
    const p=document.createElement('div'); p.className='card-plain'; p.textContent=text;
    sec.appendChild(p); body.appendChild(sec); wrap.appendChild(header); wrap.appendChild(body); card.appendChild(wrap);
    addCardActions(card,wrap,text,question); return card;
  }
  const wrap=document.createElement('div'); wrap.className='bot-card';
  const titleSec=sections.find(s=>s.type==='text');
  const header=document.createElement('div'); header.className='bot-card-header';
  header.innerHTML=`<span class="bot-card-title">${titleSec?titleSec.text.toUpperCase():'AI APITECH'}</span>`;
  wrap.appendChild(header);
  const body=document.createElement('div'); body.className='bot-card-body';
  let isFirst=true;
  for(const sec of sections) {
    if(sec.type==='text'&&isFirst){isFirst=false;continue;}
    const div=document.createElement('div'); div.className='card-section';
    if(sec.type==='kv') {
      const kv=document.createElement('div'); kv.className='card-kv';
      sec.items.forEach((item,i)=>{const row=document.createElement('div');row.className='card-row';const isResult=item.sep==='≈'||i===sec.items.length-1;row.innerHTML=`<span class="card-key">${item.key}</span><span class="card-val${isResult?' highlight':''}">${item.sep} ${item.val}</span>`;kv.appendChild(row);});
      div.appendChild(kv);
    } else { const p=document.createElement('div');p.className='card-plain';p.textContent=sec.text;div.appendChild(p); }
    body.appendChild(div); isFirst=false;
  }
  wrap.appendChild(body); card.appendChild(wrap); addCardActions(card,wrap,text,question); return card;
}
function addCardActions(card,wrap,text,question) {
  const actions=document.createElement('div'); actions.className='card-actions';
  const copyBtn=document.createElement('button'); copyBtn.className='copy-btn'; copyBtn.textContent='COPY';
  copyBtn.onclick=()=>{ navigator.clipboard.writeText(text).then(()=>{copyBtn.textContent='COPIED ✓';setTimeout(()=>copyBtn.textContent='COPY',2000);}); };
  const shareBtn=document.createElement('button'); shareBtn.className='share-btn'; shareBtn.textContent='SHARE';
  shareBtn.onclick=()=>shareResult(text,question||'');
  actions.appendChild(copyBtn); actions.appendChild(shareBtn); wrap.appendChild(actions);
}

/* ── Voice input ── */
let recognition=null, isListening=false, voiceTimeout=null;
const SpeechRecognitionAPI=window.SpeechRecognition||window.webkitSpeechRecognition;
function setVoiceUI(active) {
  const btn=document.getElementById('voiceBtn'); const status=document.getElementById('voiceStatus');
  if(!btn||!status)return;
  if(active){btn.classList.add('listening');status.classList.add('active');input.placeholder='🎙 กำลังฟัง... (พูดได้เลย)';}
  else{btn.classList.remove('listening');status.classList.remove('active');input.placeholder='พิมพ์คำถามหรือค่าที่ต้องการคำนวณ...';}
}
function stopVoice() { isListening=false;setVoiceUI(false);clearTimeout(voiceTimeout);if(recognition){try{recognition.abort();}catch(e){}recognition=null;} }
function startVoice() {
  if(!SpeechRecognitionAPI){alert('Voice Input ไม่รองรับในเบราว์เซอร์นี้\nกรุณาใช้ Chrome หรือ Edge บน Android/Desktop ครับ');return;}
  stopVoice(); const r=new SpeechRecognitionAPI(); r.lang='th-TH';r.continuous=false;r.interimResults=true;r.maxAlternatives=3; recognition=r;
  r.onstart=()=>{isListening=true;setVoiceUI(true);voiceTimeout=setTimeout(()=>{if(isListening)stopVoice();},10000);};
  r.onresult=(e)=>{let interim='',final='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)final+=t;else interim+=t;}input.value=final||interim;updateCharCount(input);};
  r.onend=()=>{const txt=input.value.trim();stopVoice();if(txt)setTimeout(()=>sendMessage(),100);};
  r.onerror=(e)=>{stopVoice();const msgs={'not-allowed':'ไม่ได้รับอนุญาตใช้ไมโครโฟน\nกรุณากด Allow ในเบราว์เซอร์','no-speech':'ไม่ได้ยินเสียง ลองพูดใกล้ไมค์อีกครั้ง','network':'เชื่อมต่อ network ไม่ได้','aborted':''};const msg=msgs[e.error];if(msg)alert(msg);};
  try{r.start();}catch(e){stopVoice();alert('เริ่ม Voice Input ไม่ได้: '+e.message);}
}
function toggleVoice() { if(isListening)stopVoice();else startVoice(); }

/* ── Share ── */
function shareResult(text,question) {
  const shareText=['🔧 AI API TECH T0.1','',`📌 คำถาม: ${question}`,'','📊 ผลลัพธ์:',text].join('\n');
  navigator.clipboard.writeText(shareText).then(()=>{const toast=document.getElementById('shareToast');if(toast){toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2000);}});
}

/* ══ openModal ══ */
function openModal(key) {
  closeModal();
  const data = modalData[key];
  if (!data) return;

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'modalBackdrop';
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });

  const box = document.createElement('div');
  box.className = 'modal-box';

  // Header
  const header = document.createElement('div');
  header.className = 'modal-header';

  const titleGroup = document.createElement('div');
  titleGroup.className = 'modal-title-group';

  if (data.icon) {
    const img = document.createElement('img');
    img.src = data.icon;
    img.className = 'modal-icon';
    img.alt = data.title;
    img.onerror = () => img.style.display = 'none';
    titleGroup.appendChild(img);
  }

  const titleWrap = document.createElement('div');
  const titleEl = document.createElement('div');
  titleEl.className = 'modal-title';
  titleEl.textContent = data.title;
  const subtitleEl = document.createElement('div');
  subtitleEl.className = 'modal-subtitle';
  subtitleEl.textContent = '◈ ' + data.subtitle;
  titleWrap.appendChild(titleEl);
  titleWrap.appendChild(subtitleEl);
  titleGroup.appendChild(titleWrap);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.textContent = '×';
  closeBtn.onclick = closeModal;

  header.appendChild(titleGroup);
  header.appendChild(closeBtn);
  box.appendChild(header);

  // Body
  const body = document.createElement('div');
  body.className = 'modal-body';

  if (data.desc) {
    const descBlock = document.createElement('div');
    descBlock.className = 'modal-desc';
    const descP = document.createElement('p');
    descP.textContent = data.desc;
    descBlock.appendChild(descP);
    body.appendChild(descBlock);
  }

  if (data.params && data.params.length) {
    const paramTitle = document.createElement('div');
    paramTitle.className = 'modal-section-title';
    paramTitle.textContent = '◈ ค่าที่ระบุได้';
    body.appendChild(paramTitle);

    const paramWrap = document.createElement('div');
    paramWrap.className = 'modal-params';
    data.params.forEach(p => {
      const badge = document.createElement('span');
      badge.className = 'modal-param';
      badge.textContent = p;
      paramWrap.appendChild(badge);
    });
    body.appendChild(paramWrap);
  }

  if (data.examples && data.examples.length) {
    const exTitle = document.createElement('div');
    exTitle.className = 'modal-section-title';
    exTitle.textContent = '◈ ตัวอย่าง — กดส่งได้ทันที';
    body.appendChild(exTitle);

    const exWrap = document.createElement('div');
    exWrap.className = 'modal-examples';

    data.examples.forEach(ex => {
      const btn = document.createElement('button');
      btn.className = 'modal-example-btn';

      const icon = document.createElement('span');
      icon.className = 'modal-example-icon';
      icon.textContent = '▶';

      const text = document.createElement('span');
      text.className = 'modal-example-text';
      text.textContent = ex;

      const sendLabel = document.createElement('span');
      sendLabel.className = 'modal-example-send';
      sendLabel.textContent = 'ส่งทันที →';

      btn.appendChild(icon);
      btn.appendChild(text);
      btn.appendChild(sendLabel);

      btn.onclick = () => {
        closeModal();
        input.value = ex;
        updateCharCount(input);
        setTimeout(() => sendMessage(), 80);
      };

      exWrap.appendChild(btn);
    });
    body.appendChild(exWrap);
  }

  // Footer
  const footer = document.createElement('div');
  footer.className = 'modal-footer';

  const modalInput = document.createElement('input');
  modalInput.type = 'text';
  modalInput.className = 'modal-input';
  modalInput.placeholder = 'พิมพ์ค่าเอง หรือเลือกตัวอย่างด้านบน...';
  modalInput.maxLength = 300;
  modalInput.addEventListener('keypress', e => {
    if (e.key === 'Enter') sendFromModal(modalInput.value);
  });

  const modalSendBtn = document.createElement('button');
  modalSendBtn.className = 'modal-send-btn';
  modalSendBtn.textContent = 'SEND →';
  modalSendBtn.onclick = () => sendFromModal(modalInput.value);

  footer.appendChild(modalInput);
  footer.appendChild(modalSendBtn);
  body.appendChild(footer);

  box.appendChild(body);
  backdrop.appendChild(box);
  document.body.appendChild(backdrop);

  setTimeout(() => modalInput.focus(), 200);
  document.addEventListener('keydown', onModalKeyDown);
}

function sendFromModal(text) {
  const t = (text || '').trim();
  if (!t) return;
  closeModal();
  input.value = t;
  updateCharCount(input);
  setTimeout(() => sendMessage(), 80);
}

function closeModal() {
  const el = document.getElementById('modalBackdrop');
  if (el) el.remove();
  document.removeEventListener('keydown', onModalKeyDown);
}

function onModalKeyDown(e) {
  if (e.key === 'Escape') closeModal();
}
</script>
